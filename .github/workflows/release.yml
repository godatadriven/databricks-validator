name: release
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      bump_level:
        type: choice
        description: Select bump level
        required: true
        options:
          - patch
          - minor
          - major

permissions:
  contents: write   # push the bump commit and the tag, and create the release

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check that the PyPI token is configured
        # Fails before anything is changed, so a missing or misnamed secret costs nothing.
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "${PYPI_TOKEN}" ]; then
            echo "::error::secret PYPI_TOKEN is not set on the repository or the 'release' environment; nothing was changed."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the tag needs the full history
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Bump the version everywhere it is written down
        # Commit and tag locally only; they are pushed after PyPI has accepted the build.
        run: |
          set -eux
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"
          PREVIOUS=$(uv version --short)
          uv version --bump '${{ github.event.inputs.bump_level }}'
          VERSION=$(uv version --short)
          sed -i "s/:v${PREVIOUS}$/:v${VERSION}/" .pre-commit-hooks.yaml
          sed -i "s/v${PREVIOUS}/v${VERSION}/g" README.md
          sed -i "s/__version__ = \"${PREVIOUS}\"/__version__ = \"${VERSION}\"/" \
            src/databricks_validator/__init__.py
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed after the bump." >&2
            exit 1
          fi
          git commit -m "Release v${VERSION}"
          git tag "v${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Build
        run: uv build
      - name: Publish to PyPI
        # Token-based publishing: the OIDC trusted publisher for this project cannot be configured right now.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
      - name: Push the release commit and tag
        # Only after PyPI accepted the build, so a failed publish leaves no orphan version behind.
        run: |
          set -eux
          git push origin HEAD:main
          git push origin "v${VERSION}"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            --notes "PyPI: https://pypi.org/project/databricks-validator/${VERSION}/"
