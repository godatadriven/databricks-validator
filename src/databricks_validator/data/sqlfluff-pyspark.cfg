# Default sqlfluff configuration for SQL lifted out of spark.sql() calls.
#
# This is only used when the repository being checked does not provide its own `.sqlfluff`
# or a [tool.sqlfluff] section in its pyproject.toml.
#
# Unlike the dashboard defaults this leaves the layout rules switched on. SQL written
# inside a python file is written and maintained by hand, and reformatting it is the whole
# point of `--fix`, so there is no editor upstream whose formatting has to be tolerated.
[sqlfluff]
dialect = databricks

# references.from           false positives on struct access, e.g. `t.details.job.id`
# references.qualification  unqualified column names are idiomatic in short embedded queries
exclude_rules = references.from, references.qualification

max_line_length = 120
